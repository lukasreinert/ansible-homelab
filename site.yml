---
- name: Common baseline for all hosts
  hosts: all
  become: true
  gather_facts: true
  roles:
    - netbird

- name: Configure Proxmox nodes
  hosts: proxmox
  become: true
  gather_facts: true
  roles:
    - proxmox

- name: Configure generic Linux servers
  hosts: linux_server
  become: true
  gather_facts: true
  roles:
    - linux_server
