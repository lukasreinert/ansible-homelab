# Authentication
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes

# Brute-force and resource limits
LoginGraceTime 30
MaxAuthTries 3
MaxStartups 10:30:60
MaxSessions 4

# Disable forwarding that is not required for CLI, SCP or SFTP
X11Forwarding no
DisableForwarding yes

# Disable user-controlled SSH session configuration
PermitUserEnvironment no
PermitUserRC no

# Logging and inactive-session handling
LogLevel VERBOSE
PrintLastLog yes
ClientAliveInterval 300
ClientAliveCountMax 2

# Use only the current authorized-keys file
AuthorizedKeysFile .ssh/authorized_keys

# Permit root public-key login only from trusted networks
Match Address 172.16.0.0/16,100.108.0.0/16
    PermitRootLogin prohibit-password