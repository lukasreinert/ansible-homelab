---
- name: Validate configured users
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.shell is defined
      - item.shell in ['bash', 'zsh']
      - item.password_hash is defined
      - item.ssh_public_key is defined
    fail_msg: >-
      Invalid user configuration for '{{ item.name | default('undefined') }}'.
      Each user requires name, shell, password_hash and ssh_public_key.
      The shell must be either 'bash' or 'zsh'.
  loop: "{{ linux_server_users }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"
  no_log: true

- name: Initialize resolved user list
  ansible.builtin.set_fact:
    linux_server_users_resolved: []

- name: Resolve user home directories and shell paths
  ansible.builtin.set_fact:
    linux_server_users_resolved: >-
      {{
        linux_server_users_resolved
        + [
            item | combine(
              {
                'home':
                  '/root'
                  if item.name == 'root'
                  else '/home/' ~ item.name,
                'shell_path':
                  linux_server_shell_paths[item.shell]
              }
            )
          ]
      }}
  loop: "{{ linux_server_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Ensure configured users exist
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    home: "{{ linux_server_user.home }}"
    state: present
    create_home: true
    shell: "{{ linux_server_user.shell_path }}"
    password: "{{ linux_server_user.password_hash }}"
    update_password: always
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
  no_log: true

- name: Ensure SSH directories exist
  ansible.builtin.file:
    path: "{{ linux_server_user.home }}/.ssh"
    state: directory
    owner: "{{ linux_server_user.name }}"
    group: "{{ linux_server_user.name }}"
    mode: "0700"
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Install authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ linux_server_user.name }}"
    path: "{{ linux_server_user.home }}/.ssh/authorized_keys"
    key: "{{ lookup('ansible.builtin.file', linux_server_user.ssh_public_key) }}"
    state: present
    manage_dir: false
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Ensure authorized_keys permissions
  ansible.builtin.file:
    path: "{{ linux_server_user.home }}/.ssh/authorized_keys"
    state: file
    owner: "{{ linux_server_user.name }}"
    group: "{{ linux_server_user.name }}"
    mode: "0600"
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Add configured users to the sudo group on Debian-family systems
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    groups:
      - sudo
    append: true
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
  when:
    - linux_server_user.sudo | default(false) | bool
    - linux_server_user.name != 'root'
    - ansible_facts['os_family'] == 'Debian'

- name: Add configured users to the wheel group on RedHat-family systems
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    groups:
      - wheel
    append: true
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
  when:
    - linux_server_user.sudo | default(false) | bool
    - linux_server_user.name != 'root'
    - ansible_facts['os_family'] == 'RedHat'
