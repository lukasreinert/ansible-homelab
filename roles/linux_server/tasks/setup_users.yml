---
- name: Derive home directories for configured users
  ansible.builtin.set_fact:
    linux_server_users_resolved: >-
      {{
        linux_server_users_resolved | default([])
        + [
            item | combine(
              {
                'home':
                  '/root'
                  if item.name == 'root'
                  else '/home/' ~ item.name
              }
            )
          ]
      }}
  loop: "{{ linux_server_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure Zsh and Git are installed
  ansible.builtin.package:
    name:
      - zsh
      - git
    state: present

- name: Ensure configured users exist
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    home: "{{ linux_server_user.home }}"
    state: present
    create_home: true
    shell: /usr/bin/zsh
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Ensure SSH directories exist
  ansible.builtin.file:
    path: "{{ linux_server_user.home }}/.ssh"
    state: directory
    owner: "{{ linux_server_user.name }}"
    group: "{{ linux_server_user.name }}"
    mode: "0700"
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Install authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ linux_server_user.name }}"
    path: "{{ linux_server_user.home }}/.ssh/authorized_keys"
    key: "{{ lookup('ansible.builtin.file', linux_server_user.ssh_public_key) }}"
    state: present
    manage_dir: false
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Set passwords after SSH keys are installed
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    password: "{{ linux_server_user.password_hash }}"
    update_password: always
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
  no_log: true

- name: Add configured users to the sudo group
  ansible.builtin.user:
    name: "{{ linux_server_user.name }}"
    groups:
      - "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
    append: true
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
  when:
    - linux_server_user.sudo | default(false) | bool
    - linux_server_user.name != 'root'
    - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Download Oh My Zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: "0755"

- name: Ensure Ansible temporary directories exist
  ansible.builtin.file:
    path: "/tmp/.ansible-{{ linux_server_user.name }}"
    state: directory
    owner: "{{ linux_server_user.name }}"
    group: "{{ linux_server_user.name }}"
    mode: "0700"
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Install Oh My Zsh for configured users
  become: true
  become_user: "{{ linux_server_user.name }}"
  ansible.builtin.command:
    argv:
      - /tmp/ohmyzsh-install.sh
    creates: "{{ linux_server_user.home }}/.oh-my-zsh"
  vars:
    ansible_remote_tmp: "/tmp/.ansible-{{ linux_server_user.name }}"
  environment:
    HOME: "{{ linux_server_user.home }}"
    USER: "{{ linux_server_user.name }}"
    RUNZSH: "no"
    CHSH: "no"
    KEEP_ZSHRC: "yes"
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"

- name: Create .zshrc for configured users
  ansible.builtin.copy:
    dest: "{{ linux_server_user.home }}/.zshrc"
    owner: "{{ linux_server_user.name }}"
    group: "{{ linux_server_user.name }}"
    mode: "0644"
    force: true
    content: |
      export PATH="$HOME/.local/bin:$PATH"
      export ZSH="$HOME/.oh-my-zsh"

      PROMPT='%F{cyan}%n%f@%m %~ %# '

      plugins=(git)

      source "$ZSH/oh-my-zsh.sh"

      alias nv='nvim'
      alias ll='ls -alhF --color=auto'
  loop: "{{ linux_server_users_resolved }}"
  loop_control:
    loop_var: linux_server_user
    label: "{{ linux_server_user.name }}"
